[project]
name = "chatbot"
version = "1.0.0"
dependencies = [
    "fastapi[all]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot"]
