<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #e6edf3; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .auth {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at top, #1d3557, #0d1117 55%);
    }
    .card {
      width: min(420px, 100%); padding: 32px; border: 1px solid #30363d;
      border-radius: 18px; background: #161b22; box-shadow: 0 20px 60px #0008;
    }
    h1, h2, p { margin-top: 0; }
    .muted { color: #8b949e; }
    label { display: block; margin: 16px 0 6px; font-size: .9rem; }
    input, textarea {
      width: 100%; border: 1px solid #30363d; border-radius: 9px;
      padding: 11px 12px; background: #0d1117; color: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #58a6ff; }
    .primary, .secondary, .danger, .icon {
      border: 0; border-radius: 9px; padding: 10px 14px; color: white;
    }
    .primary { background: #238636; }
    .primary:hover { background: #2ea043; }
    .secondary, .icon { background: #30363d; }
    .danger { background: #8b1d24; }
    .wide { width: 100%; margin-top: 20px; }
    .switch { margin-top: 18px; text-align: center; }
    .link { padding: 0; border: 0; background: none; color: #58a6ff; }
    .error { min-height: 22px; margin: 12px 0 0; color: #ff7b72; }
    .shell { height: 100vh; display: grid; grid-template-columns: 290px 1fr; }
    aside {
      min-width: 0; display: flex; flex-direction: column; padding: 16px;
      border-right: 1px solid #30363d; background: #161b22;
    }
    .sidebar-head, .chat-head, .composer { display: flex; gap: 10px; align-items: center; }
    .sidebar-head { justify-content: space-between; margin-bottom: 14px; }
    .conversation-list { flex: 1; overflow-y: auto; }
    .conversation {
      width: 100%; margin: 3px 0; padding: 11px; overflow: hidden;
      border: 0; border-radius: 9px; background: transparent; color: inherit;
      text-align: left; text-overflow: ellipsis; white-space: nowrap;
    }
    .conversation:hover, .conversation.active { background: #21262d; }
    .account { padding-top: 14px; border-top: 1px solid #30363d; }
    .account-row { display: flex; justify-content: space-between; align-items: center; }
    main { min-width: 0; display: flex; flex-direction: column; }
    .chat-head { min-height: 65px; padding: 12px 20px; border-bottom: 1px solid #30363d; }
    .chat-head h2 { flex: 1; margin: 0; overflow: hidden; text-overflow: ellipsis; }
    .messages { flex: 1; overflow-y: auto; padding: 28px max(20px, calc((100% - 800px) / 2)); }
    .empty { display: grid; height: 100%; place-items: center; color: #8b949e; text-align: center; }
    .message { display: flex; margin: 16px 0; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: min(680px, 85%); padding: 12px 15px; border-radius: 14px;
      background: #21262d; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .user .bubble { background: #1f6feb; }
    .composer { padding: 16px max(20px, calc((100% - 800px) / 2)); border-top: 1px solid #30363d; }
    .composer textarea { min-height: 46px; max-height: 160px; resize: vertical; }
    .composer button { align-self: flex-end; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    @media (max-width: 720px) {
      .shell { height: auto; min-height: 100vh; grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { max-height: 240px; border-right: 0; border-bottom: 1px solid #30363d; }
      main { min-height: 70vh; }
    }
  </style>
</head>
<body>
  <section id="auth" class="auth">
    <form id="auth-form" class="card">
      <h1 id="auth-title">Welcome back</h1>
      <p class="muted" id="auth-copy">Sign in to continue your conversations.</p>
      <div id="username-field" class="hidden">
        <label for="username">Username</label>
        <input id="username" name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username">
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="current-password">
      <button id="auth-submit" class="primary wide" type="submit">Sign in</button>
      <p id="auth-error" class="error" role="alert"></p>
      <p class="switch"><span id="switch-copy">New here?</span> <button id="switch-auth" class="link" type="button">Create an account</button></p>
    </form>
  </section>

  <section id="app" class="shell hidden">
    <aside>
      <div class="sidebar-head"><strong>Conversations</strong><button id="new-chat" class="primary" type="button">+ New</button></div>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
      <div class="account">
        <div class="account-row"><span id="account-name"></span><button id="logout" class="secondary" type="button">Log out</button></div>
      </div>
    </aside>
    <main>
      <header class="chat-head">
        <h2 id="chat-title">Select a conversation</h2>
        <button id="rename-chat" class="icon hidden" type="button">Rename</button>
        <button id="delete-chat" class="danger hidden" type="button">Delete</button>
      </header>
      <div id="messages" class="messages"><div class="empty">Create a conversation to start chatting.</div></div>
      <form id="composer" class="composer">
        <textarea id="message" aria-label="Message" placeholder="Type a message…" maxlength="20000" required disabled></textarea>
        <button id="send" class="primary" type="submit" disabled>Send</button>
      </form>
    </main>
  </section>

  <script>
    const API = "/api/v1";
    const $ = (id) => document.getElementById(id);
    let registering = false;
    let currentConversation = null;
    let conversationList = [];

    function tokens(value) {
      if (value) localStorage.setItem("tokens", JSON.stringify(value));
      return JSON.parse(localStorage.getItem("tokens") || "null");
    }

    function errorText(data) {
      if (typeof data?.detail === "string") return data.detail;
      if (Array.isArray(data?.detail)) return data.detail.map((item) => item.msg).join("; ");
      return "Something went wrong.";
    }

    async function request(path, options = {}, retry = true) {
      const saved = tokens();
      const headers = { "Content-Type": "application/json", ...options.headers };
      if (saved?.access_token) headers.Authorization = `Bearer ${saved.access_token}`;
      const response = await fetch(API + path, { ...options, headers });
      if (response.status === 401 && retry && saved?.refresh_token) {
        const refreshed = await fetch(API + "/auth/refresh", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: saved.refresh_token })
        });
        if (refreshed.ok) {
          tokens(await refreshed.json());
          return request(path, options, false);
        }
        signOut(false);
      }
      if (!response.ok) {
        let data = {};
        try { data = await response.json(); } catch {}
        throw new Error(errorText(data));
      }
      return response.status === 204 ? null : response.json();
    }

    function setAuthMode(register) {
      registering = register;
      $("username-field").classList.toggle("hidden", !register);
      $("username").required = register;
      $("password").autocomplete = register ? "new-password" : "current-password";
      $("auth-title").textContent = register ? "Create account" : "Welcome back";
      $("auth-copy").textContent = register ? "Start a new conversation in seconds." : "Sign in to continue your conversations.";
      $("auth-submit").textContent = register ? "Create account" : "Sign in";
      $("switch-copy").textContent = register ? "Already registered?" : "New here?";
      $("switch-auth").textContent = register ? "Sign in" : "Create an account";
      $("auth-error").textContent = "";
    }

    function showAuth() {
      $("app").classList.add("hidden");
      $("auth").classList.remove("hidden");
    }

    function addMessage(role, content) {
      $("messages").querySelector(".empty")?.remove();
      const row = document.createElement("div");
      const bubble = document.createElement("div");
      row.className = `message ${role}`;
      bubble.className = "bubble";
      bubble.textContent = content;
      row.appendChild(bubble);
      $("messages").appendChild(row);
      $("messages").scrollTop = $("messages").scrollHeight;
      return row;
    }

    function renderConversations() {
      const list = $("conversation-list");
      list.replaceChildren();
      for (const conversation of conversationList) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "conversation" + (conversation.id === currentConversation?.id ? " active" : "");
        button.textContent = conversation.title || "New conversation";
        button.onclick = () => selectConversation(conversation);
        list.appendChild(button);
      }
    }

    async function loadConversations() {
      conversationList = await request("/chat/conversations");
      renderConversations();
      if (conversationList.length) await selectConversation(conversationList[0]);
    }

    async function selectConversation(conversation) {
      currentConversation = conversation;
      renderConversations();
      $("chat-title").textContent = conversation.title || "New conversation";
      $("rename-chat").classList.remove("hidden");
      $("delete-chat").classList.remove("hidden");
      $("message").disabled = false;
      $("send").disabled = false;
      $("messages").innerHTML = '<div class="empty">Loading…</div>';
      try {
        const history = await request(`/chat/conversations/${conversation.id}/messages`);
        $("messages").replaceChildren();
        history.messages.forEach((item) => addMessage(item.role, item.content));
        if (!history.messages.length) $("messages").innerHTML = '<div class="empty">Send the first message.</div>';
      } catch (error) {
        $("messages").innerHTML = `<div class="empty"></div>`;
        $("messages").firstChild.textContent = error.message;
      }
    }

    async function startApp() {
      try {
        const user = await request("/auth/me");
        $("account-name").textContent = user.username || user.email;
        $("auth").classList.add("hidden");
        $("app").classList.remove("hidden");
        await loadConversations();
      } catch {
        signOut(false);
      }
    }

    async function signOut(revoke = true) {
      const saved = tokens();
      if (revoke && saved?.refresh_token) {
        try { await request("/auth/logout", { method: "POST", body: JSON.stringify({ refresh_token: saved.refresh_token }) }, false); } catch {}
      }
      localStorage.removeItem("tokens");
      currentConversation = null;
      showAuth();
    }

    $("switch-auth").onclick = () => setAuthMode(!registering);
    $("auth-form").onsubmit = async (event) => {
      event.preventDefault();
      $("auth-error").textContent = "";
      const body = { email: $("email").value, password: $("password").value };
      if (registering) body.username = $("username").value;
      try {
        tokens(await request(registering ? "/auth/register" : "/auth/login", { method: "POST", body: JSON.stringify(body) }, false));
        await startApp();
      } catch (error) { $("auth-error").textContent = error.message; }
    };

    $("new-chat").onclick = async () => {
      const conversation = await request("/chat/conversations", { method: "POST", body: "{}" });
      conversationList.unshift(conversation);
      await selectConversation(conversation);
      $("message").focus();
    };

    $("composer").onsubmit = async (event) => {
      event.preventDefault();
      const text = $("message").value.trim();
      if (!text || !currentConversation) return;
      $("message").value = "";
      $("send").disabled = true;
      addMessage("user", text);
      const waiting = addMessage("assistant", "Thinking…");
      try {
        const answer = await request(`/chat/conversations/${currentConversation.id}/messages`, { method: "POST", body: JSON.stringify({ message: text }) });
        waiting.querySelector(".bubble").textContent = answer.content;
        if (!currentConversation.title) {
          currentConversation.title = text.slice(0, 100);
          $("chat-title").textContent = currentConversation.title;
          renderConversations();
        }
      } catch (error) {
        waiting.querySelector(".bubble").textContent = `Error: ${error.message}`;
      } finally { $("send").disabled = false; $("message").focus(); }
    };

    $("message").onkeydown = (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("composer").requestSubmit(); }
    };

    $("rename-chat").onclick = async () => {
      const title = prompt("Conversation title", currentConversation?.title || "");
      if (!title?.trim()) return;
      const updated = await request(`/chat/conversations/${currentConversation.id}`, { method: "PATCH", body: JSON.stringify({ title }) });
      Object.assign(currentConversation, updated);
      $("chat-title").textContent = updated.title;
      renderConversations();
    };

    $("delete-chat").onclick = async () => {
      if (!currentConversation || !confirm("Delete this conversation?")) return;
      await request(`/chat/conversations/${currentConversation.id}`, { method: "DELETE" });
      conversationList = conversationList.filter((item) => item.id !== currentConversation.id);
      currentConversation = null;
      $("chat-title").textContent = "Select a conversation";
      $("rename-chat").classList.add("hidden");
      $("delete-chat").classList.add("hidden");
      $("message").disabled = true;
      $("send").disabled = true;
      $("messages").innerHTML = '<div class="empty">Create a conversation to start chatting.</div>';
      renderConversations();
      if (conversationList.length) await selectConversation(conversationList[0]);
    };

    $("logout").onclick = () => signOut();
    if (tokens()) startApp(); else showAuth();
  </script>
</body>
</html>
