<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #0d1117; color: #e6edf3; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
    .auth {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at top, #1d3557, #0d1117 55%);
    }
    .card {
      width: min(420px, 100%); padding: 32px; border: 1px solid #30363d;
      border-radius: 18px; background: #161b22; box-shadow: 0 20px 60px #0008;
    }
    h1, h2, p { margin-top: 0; }
    .muted { color: #8b949e; }
    label { display: block; margin: 16px 0 6px; font-size: .9rem; }
    input, textarea {
      width: 100%; border: 1px solid #30363d; border-radius: 9px;
      padding: 11px 12px; background: #0d1117; color: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: #58a6ff; }
    .primary, .secondary {
      border: 0; border-radius: 9px; padding: 10px 14px; color: white;
    }
    .primary { background: #238636; }
    .primary:hover { background: #2ea043; }
    .secondary { background: #30363d; }
    .wide { width: 100%; margin-top: 20px; }
    .switch { margin-top: 18px; text-align: center; }
    .link { padding: 0; border: 0; background: none; color: #58a6ff; }
    .error { min-height: 22px; margin: 12px 0 0; color: #ff7b72; }
    .shell { height: 100dvh; overflow: hidden; display: grid; grid-template-columns: 290px minmax(0, 1fr) 260px; }
    aside {
      min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 16px;
      border-right: 1px solid #30363d; background: #161b22;
    }
    .sidebar-head, .chat-head, .composer { display: flex; gap: 10px; align-items: center; }
    .sidebar-head { justify-content: space-between; margin-bottom: 14px; }
    .conversation-list { min-height: 0; flex: 1; overflow-y: auto; }
    .conversation-item { position: relative; display: flex; align-items: center; gap: 4px; }
    .conversation {
      min-width: 0; flex: 1; margin: 3px 0; padding: 11px; overflow: hidden;
      border: 0; border-radius: 9px; background: transparent; color: inherit;
      text-align: left; text-overflow: ellipsis; white-space: nowrap;
    }
    .conversation:hover, .conversation.active { background: #21262d; }
    .conversation-menu summary {
      width: 34px; height: 34px; display: grid; place-items: center;
      border-radius: 8px; color: #8b949e; cursor: pointer; list-style: none;
    }
    .conversation-menu summary::-webkit-details-marker { display: none; }
    .conversation-menu summary:hover, .conversation-menu[open] summary { background: #30363d; color: white; }
    .menu-items {
      position: absolute; z-index: 2; top: 38px; right: 0; width: 130px;
      padding: 5px; border: 1px solid #30363d; border-radius: 9px;
      background: #21262d; box-shadow: 0 10px 30px #0008;
    }
    .menu-items button {
      width: 100%; padding: 8px 10px; border: 0; border-radius: 6px;
      background: transparent; color: inherit; text-align: left;
    }
    .menu-items button:hover { background: #30363d; }
    .menu-items .delete-option { color: #ff7b72; }
    .account { padding-top: 14px; border-top: 1px solid #30363d; }
    .account-row { display: flex; justify-content: space-between; align-items: center; }
    main { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    .chat-head { min-height: 65px; padding: 12px 20px; border-bottom: 1px solid #30363d; }
    .chat-head h2 { flex: 1; margin: 0; overflow: hidden; text-overflow: ellipsis; }
    .messages { min-height: 0; flex: 1; overflow-y: auto; padding: 28px max(20px, calc((100% - 800px) / 2)); }
    .empty { display: grid; height: 100%; place-items: center; color: #8b949e; text-align: center; }
    .message { display: flex; margin: 16px 0; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: min(680px, 85%); padding: 12px 15px; border-radius: 14px;
      background: #21262d; white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .bubble > :first-child { margin-top: 0; }
    .bubble > :last-child { margin-bottom: 0; }
    .bubble pre {
      overflow-x: auto; padding: 12px; border-radius: 8px; background: #0d1117;
    }
    .bubble code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .bubble :not(pre) > code { padding: 2px 5px; border-radius: 5px; background: #0d1117; }
    .bubble blockquote { margin-left: 0; padding-left: 14px; border-left: 3px solid #30363d; color: #b1bac4; }
    .bubble a { color: #58a6ff; }
    .bubble img { max-width: 100%; }
    .assistant .bubble { white-space: normal; }
    .assistant .bubble pre { white-space: pre; }
    .assistant .bubble h1 { font-size: 1.65rem; }
    .assistant .bubble h2 { font-size: 1.4rem; }
    .assistant .bubble h3 { font-size: 1.2rem; }
    .assistant .bubble h1,
    .assistant .bubble h2,
    .assistant .bubble h3 { margin: 1em 0 .5em; line-height: 1.25; }
    .user .bubble { background: #1f6feb; }
    .composer { padding: 16px max(20px, calc((100% - 800px) / 2)); border-top: 1px solid #30363d; }
    .composer textarea { min-height: 46px; max-height: 160px; resize: vertical; }
    .composer button { align-self: flex-end; }
    .file-panel {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      border-left: 1px solid #30363d; background: #161b22;
    }
    .file-panel h3 { margin: 0; padding: 20px 16px; border-bottom: 1px solid #30363d; }
    .file-groups { min-height: 0; overflow-y: auto; padding: 14px; }
    .file-group { margin-bottom: 22px; }
    .file-group h4 { margin: 0 0 8px; color: #8b949e; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
    .file-list { display: grid; gap: 6px; }
    .file-chip {
      width: 100%; overflow: hidden; border: 1px solid #30363d; border-radius: 8px;
      padding: 9px 10px; background: #21262d; color: inherit;
      text-align: left; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-empty { color: #8b949e; font-size: .9rem; }
    dialog {
      width: min(760px, calc(100% - 32px)); max-height: 80vh; padding: 0;
      border: 1px solid #30363d; border-radius: 14px; background: #161b22;
      color: inherit;
    }
    dialog::backdrop { background: #000a; }
    .preview-head { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid #30363d; }
    .preview-head strong { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-body { max-height: 60vh; overflow: auto; padding: 18px; }
    .preview-body pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .preview-body img { display: block; max-width: 100%; margin: auto; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    @media (max-width: 720px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: 180px minmax(0, 1fr) 160px; }
      aside { border-right: 0; border-bottom: 1px solid #30363d; }
      .file-panel { border-left: 0; border-top: 1px solid #30363d; }
      .file-panel h3 { padding: 10px 14px; }
      .file-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 10px 14px; }
    }
  </style>
</head>
<body>
  <section id="auth" class="auth">
    <form id="auth-form" class="card">
      <h1 id="auth-title">Welcome back</h1>
      <p class="muted" id="auth-copy">Sign in to continue your conversations.</p>
      <div id="username-field" class="hidden">
        <label for="username">Username</label>
        <input id="username" name="username" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" autocomplete="username">
      </div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" minlength="8" maxlength="128" required autocomplete="current-password">
      <button id="auth-submit" class="primary wide" type="submit">Sign in</button>
      <p id="auth-error" class="error" role="alert"></p>
      <p class="switch"><span id="switch-copy">New here?</span> <button id="switch-auth" class="link" type="button">Create an account</button></p>
    </form>
  </section>

  <section id="app" class="shell hidden">
    <aside>
      <div class="sidebar-head"><strong>Conversations</strong><button id="new-chat" class="primary" type="button">+ New</button></div>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
      <div class="account">
        <div class="account-row"><span id="account-name"></span><button id="logout" class="secondary" type="button">Log out</button></div>
      </div>
    </aside>
    <main>
      <header class="chat-head">
        <h2 id="chat-title">Select a conversation</h2>
      </header>
      <div id="messages" class="messages"><div class="empty">Create a conversation to start chatting.</div></div>
      <form id="composer" class="composer">
        <input id="file-input" type="file" multiple hidden>
        <button id="attach" class="secondary" type="button" disabled>Attach</button>
        <textarea id="message" aria-label="Message" placeholder="Type a message…" maxlength="20000" required disabled></textarea>
        <button id="send" class="primary" type="submit" disabled>Send</button>
      </form>
    </main>
    <section class="file-panel" aria-label="Conversation files">
      <h3>Files</h3>
      <div class="file-groups">
        <section class="file-group">
          <h4>Uploaded</h4>
          <div id="uploaded-files" class="file-list"><span class="file-empty">No uploaded files</span></div>
        </section>
        <section class="file-group">
          <h4>Generated</h4>
          <div id="generated-files" class="file-list"><span class="file-empty">No generated files</span></div>
        </section>
      </div>
    </section>
  </section>

  <dialog id="file-preview">
    <div class="preview-head">
      <strong id="preview-name"></strong>
      <a id="download-file" class="link" download>Download</a>
      <button id="close-preview" class="secondary" type="button">Close</button>
    </div>
    <div id="preview-body" class="preview-body"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"></script>
  <script>
    const API = "/api/v1";
    const $ = (id) => document.getElementById(id);
    let registering = false;
    let currentConversation = null;
    let conversationList = [];
    let pendingFiles = [];
    let previewUrl = null;

    function tokens(value) {
      if (value) localStorage.setItem("tokens", JSON.stringify(value));
      return JSON.parse(localStorage.getItem("tokens") || "null");
    }

    function errorText(data) {
      if (typeof data?.detail === "string") return data.detail;
      if (Array.isArray(data?.detail)) return data.detail.map((item) => item.msg).join("; ");
      return "Something went wrong.";
    }

    async function request(path, options = {}, retry = true) {
      const saved = tokens();
      const { raw = false, ...fetchOptions } = options;
      const headers = { ...fetchOptions.headers };
      if (!(fetchOptions.body instanceof FormData)) headers["Content-Type"] = "application/json";
      if (saved?.access_token) headers.Authorization = `Bearer ${saved.access_token}`;
      const response = await fetch(API + path, { ...fetchOptions, headers });
      if (response.status === 401 && retry && saved?.refresh_token) {
        const refreshed = await fetch(API + "/auth/refresh", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ refresh_token: saved.refresh_token })
        });
        if (refreshed.ok) {
          tokens(await refreshed.json());
          return request(path, options, false);
        }
        signOut(false);
      }
      if (!response.ok) {
        let data = {};
        try { data = await response.json(); } catch {}
        throw new Error(errorText(data));
      }
      if (raw) return response;
      return response.status === 204 ? null : response.json();
    }

    function filePath(name) {
      return name.split("/").map(encodeURIComponent).join("/");
    }

    function renderFiles(files) {
      for (const source of ["uploaded", "generated"]) {
        const container = $(`${source}-files`);
        const matching = files.filter((file) => file.source === source);
        container.replaceChildren();
        if (!matching.length) {
          const empty = document.createElement("span");
          empty.className = "file-empty";
          empty.textContent = `No ${source} files`;
          container.appendChild(empty);
          continue;
        }
        for (const file of matching) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "file-chip";
          button.textContent = `📎 ${file.name.split("/").pop()}`;
          button.title = file.name;
          button.onclick = () => previewFile(file);
          container.appendChild(button);
        }
      }
    }

    async function loadFiles() {
      if (!currentConversation) return renderFiles([]);
      renderFiles(await request(`/chat/conversations/${currentConversation.id}/files`));
    }

    async function previewFile(file) {
      const response = await request(
        `/chat/conversations/${currentConversation.id}/files/${filePath(file.name)}`,
        { raw: true }
      );
      const blob = await response.blob();
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(blob);
      $("preview-name").textContent = file.name;
      $("download-file").href = previewUrl;
      $("download-file").download = file.name.split("/").pop();
      $("preview-body").replaceChildren();
      if (file.content_type.startsWith("image/") && file.content_type !== "image/svg+xml") {
        const image = document.createElement("img");
        image.src = previewUrl;
        image.alt = file.name;
        $("preview-body").appendChild(image);
      } else if (file.content_type.startsWith("text/")) {
        const text = document.createElement("pre");
        text.textContent = await blob.text();
        $("preview-body").appendChild(text);
      } else {
        $("preview-body").textContent = "Preview is unavailable for this file type. Download it to open it.";
      }
      $("file-preview").showModal();
    }

    function setAuthMode(register) {
      registering = register;
      $("username-field").classList.toggle("hidden", !register);
      $("username").required = register;
      $("password").autocomplete = register ? "new-password" : "current-password";
      $("auth-title").textContent = register ? "Create account" : "Welcome back";
      $("auth-copy").textContent = register ? "Start a new conversation in seconds." : "Sign in to continue your conversations.";
      $("auth-submit").textContent = register ? "Create account" : "Sign in";
      $("switch-copy").textContent = register ? "Already registered?" : "New here?";
      $("switch-auth").textContent = register ? "Sign in" : "Create an account";
      $("auth-error").textContent = "";
    }

    function showAuth() {
      $("app").classList.add("hidden");
      $("auth").classList.remove("hidden");
    }

    function renderMarkdownFallback(element, content) {
      const fragment = document.createDocumentFragment();
      for (const line of content.split("\n")) {
        const heading = line.match(/^(#{1,6})\s+(.+)$/);
        const block = document.createElement(heading ? `h${heading[1].length}` : "p");
        block.textContent = heading ? heading[2] : line;
        fragment.appendChild(block);
      }
      element.replaceChildren(fragment);
    }

    function renderMarkdown(element, content) {
      if (!window.marked || !window.DOMPurify) {
        renderMarkdownFallback(element, content);
        return;
      }
      element.innerHTML = DOMPurify.sanitize(marked.parse(content), {
        USE_PROFILES: { html: true }
      });
      element.querySelectorAll("a").forEach((link) => {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      });
    }

    function addMessage(role, content) {
      $("messages").querySelector(".empty")?.remove();
      const row = document.createElement("div");
      const bubble = document.createElement("div");
      row.className = `message ${role}`;
      bubble.className = "bubble";
      if (role === "assistant") renderMarkdown(bubble, content);
      else bubble.textContent = content;
      row.appendChild(bubble);
      $("messages").appendChild(row);
      $("messages").scrollTop = $("messages").scrollHeight;
      return row;
    }

    function renderConversations() {
      const list = $("conversation-list");
      list.replaceChildren();
      for (const conversation of conversationList) {
        const item = document.createElement("div");
        const button = document.createElement("button");
        const menu = document.createElement("details");
        const summary = document.createElement("summary");
        const actions = document.createElement("div");
        const rename = document.createElement("button");
        const remove = document.createElement("button");
        item.className = "conversation-item";
        button.type = "button";
        button.className = "conversation" + (conversation.id === currentConversation?.id ? " active" : "");
        button.textContent = conversation.title || "New conversation";
        button.onclick = () => selectConversation(conversation);
        menu.className = "conversation-menu";
        summary.textContent = "⋯";
        summary.setAttribute("aria-label", `Options for ${button.textContent}`);
        actions.className = "menu-items";
        rename.type = remove.type = "button";
        rename.textContent = "Rename";
        remove.textContent = "Delete";
        remove.className = "delete-option";
        rename.onclick = () => renameConversation(conversation);
        remove.onclick = () => deleteConversation(conversation);
        actions.append(rename, remove);
        menu.append(summary, actions);
        item.append(button, menu);
        list.appendChild(item);
      }
    }

    async function loadConversations() {
      conversationList = await request("/chat/conversations");
      renderConversations();
      if (conversationList.length) await selectConversation(conversationList[0]);
    }

    async function selectConversation(conversation) {
      currentConversation = conversation;
      renderConversations();
      $("chat-title").textContent = conversation.title || "New conversation";
      $("message").disabled = false;
      $("send").disabled = false;
      $("attach").disabled = false;
      pendingFiles = [];
      $("messages").innerHTML = '<div class="empty">Loading…</div>';
      try {
        const history = await request(`/chat/conversations/${conversation.id}/messages`);
        $("messages").replaceChildren();
        history.messages.forEach((item) => addMessage(item.role, item.content));
        if (!history.messages.length) $("messages").innerHTML = '<div class="empty">Send the first message.</div>';
      } catch (error) {
        $("messages").innerHTML = `<div class="empty"></div>`;
        $("messages").firstChild.textContent = error.message;
      }
      try { await loadFiles(); } catch (error) { renderFiles([]); }
    }

    async function startApp() {
      try {
        const user = await request("/auth/me");
        $("account-name").textContent = user.username || user.email;
        $("auth").classList.add("hidden");
        $("app").classList.remove("hidden");
        await loadConversations();
      } catch {
        signOut(false);
      }
    }

    async function signOut(revoke = true) {
      const saved = tokens();
      if (revoke && saved?.refresh_token) {
        try { await request("/auth/logout", { method: "POST", body: JSON.stringify({ refresh_token: saved.refresh_token }) }, false); } catch {}
      }
      localStorage.removeItem("tokens");
      currentConversation = null;
      renderFiles([]);
      showAuth();
    }

    $("switch-auth").onclick = () => setAuthMode(!registering);
    $("auth-form").onsubmit = async (event) => {
      event.preventDefault();
      $("auth-error").textContent = "";
      const body = { email: $("email").value, password: $("password").value };
      if (registering) body.username = $("username").value;
      try {
        tokens(await request(registering ? "/auth/register" : "/auth/login", { method: "POST", body: JSON.stringify(body) }, false));
        await startApp();
      } catch (error) { $("auth-error").textContent = error.message; }
    };

    $("new-chat").onclick = async () => {
      const conversation = await request("/chat/conversations", { method: "POST", body: "{}" });
      conversationList.unshift(conversation);
      await selectConversation(conversation);
      $("message").focus();
    };

    $("attach").onclick = () => $("file-input").click();
    $("file-input").onchange = async () => {
      try {
        for (const file of $("file-input").files) {
          const form = new FormData();
          form.append("file", file);
          const uploaded = await request(
            `/chat/conversations/${currentConversation.id}/files`,
            { method: "POST", body: form }
          );
          pendingFiles.push(uploaded.name);
        }
        await loadFiles();
      } catch (error) {
        alert(error.message);
      } finally {
        $("file-input").value = "";
      }
    };

    $("composer").onsubmit = async (event) => {
      event.preventDefault();
      const text = $("message").value.trim();
      if (!text || !currentConversation) return;
      const prompt = pendingFiles.length
        ? `${text}\n\nAttached files (use read_file if needed): ${pendingFiles.join(", ")}`
        : text;
      $("message").value = "";
      $("send").disabled = true;
      addMessage("user", text);
      const waiting = addMessage("assistant", "Thinking…");
      try {
        const answer = await request(`/chat/conversations/${currentConversation.id}/messages`, { method: "POST", body: JSON.stringify({ message: prompt }) });
        pendingFiles = [];
        renderMarkdown(waiting.querySelector(".bubble"), answer.content);
        if (!currentConversation.title) {
          currentConversation.title = text.slice(0, 100);
          $("chat-title").textContent = currentConversation.title;
          renderConversations();
        }
      } catch (error) {
        waiting.querySelector(".bubble").textContent = `Error: ${error.message}`;
      } finally {
        $("send").disabled = false;
        $("message").focus();
        loadFiles().catch(() => {});
      }
    };

    $("message").onkeydown = (event) => {
      if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); $("composer").requestSubmit(); }
    };

    async function renameConversation(conversation) {
      const title = prompt("Conversation title", conversation.title || "");
      if (!title?.trim()) return;
      const updated = await request(`/chat/conversations/${conversation.id}`, { method: "PATCH", body: JSON.stringify({ title }) });
      Object.assign(conversation, updated);
      if (conversation.id === currentConversation?.id) $("chat-title").textContent = updated.title;
      renderConversations();
    }

    async function deleteConversation(conversation) {
      if (!confirm("Delete this conversation?")) return;
      await request(`/chat/conversations/${conversation.id}`, { method: "DELETE" });
      conversationList = conversationList.filter((item) => item.id !== conversation.id);
      if (conversation.id !== currentConversation?.id) {
        renderConversations();
        return;
      }
      currentConversation = null;
      $("chat-title").textContent = "Select a conversation";
      $("message").disabled = true;
      $("send").disabled = true;
      $("attach").disabled = true;
      pendingFiles = [];
      renderFiles([]);
      $("messages").innerHTML = '<div class="empty">Create a conversation to start chatting.</div>';
      renderConversations();
      if (conversationList.length) await selectConversation(conversationList[0]);
    }

    $("close-preview").onclick = () => $("file-preview").close();
    $("file-preview").onclose = () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    };

    $("logout").onclick = () => signOut();
    if (tokens()) startApp(); else showAuth();
  </script>
</body>
</html>
